<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kolwer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one rounded messenger frame. Left column: header, search, list or settings page, bottom tab bar (Чаты / Контакты / Настройки / Профиль). Right column: the conversation. Under 760px one pane at a time. */
:root{
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --bg:#E8ECF2;--panel:#FFFFFF;--panel-2:#F1F4F8;--chat-bg:#E3EAF2;--line:#DCE2EA;
  --ink:#0F1722;--muted:#66758A;--accent:#2A7BF6;--accent-ink:#FFFFFF;--sel:#E2EDFE;
  --mine-bg:#2A7BF6;--mine-fg:#FFFFFF;--their-bg:#FFFFFF;--their-fg:#0F1722;
  --gold:#C98A00;--gold-bg:#FFF3CC;--danger:#D6334B;
  --name-l:36%;--scrim:rgba(8,14,24,.5);--fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090D13;--panel:#131921;--panel-2:#1A222C;--chat-bg:#0E141B;--line:#243040;
    --ink:#E8EEF5;--muted:#8A9AAD;--accent:#4C9AFF;--accent-ink:#06162E;--sel:#1A2B44;
    --mine-bg:#2563C9;--mine-fg:#F4F8FF;--their-bg:#1C2530;--their-fg:#E8EEF5;
    --gold:#FFC93C;--gold-bg:#3A2E0B;--danger:#FF6B80;--name-l:68%;--scrim:rgba(0,0,0,.62);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090D13;--panel:#131921;--panel-2:#1A222C;--chat-bg:#0E141B;--line:#243040;
  --ink:#E8EEF5;--muted:#8A9AAD;--accent:#4C9AFF;--accent-ink:#06162E;--sel:#1A2B44;
  --mine-bg:#2563C9;--mine-fg:#F4F8FF;--their-bg:#1C2530;--their-fg:#E8EEF5;
  --gold:#FFC93C;--gold-bg:#3A2E0B;--danger:#FF6B80;--name-l:68%;--scrim:rgba(0,0,0,.62);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs);line-height:1.4;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
svg{flex:none}

.app{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--panel)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;background-color:var(--chat-bg)}
.main[data-wp="1"]{background-image:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%)}
.main[data-wp="2"]{background-image:radial-gradient(circle at 18% 8%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 55%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 50%)}
.main[data-wp="3"]{background-image:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1.2px,transparent 1.5px);background-size:18px 18px}
.icon-btn.back{display:none}
@media (max-width:759px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app.in-chat .side{display:none}
  .app:not(.in-chat) .main{display:none}
  .icon-btn.back{display:inline-grid}
}

/* sidebar */
.side-head{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;min-height:58px}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;flex:1;min-width:0;padding-left:4px;letter-spacing:.01em}
.h-title{font-weight:600;font-size:18px;flex:1;min-width:0;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.search{position:relative;margin:4px 14px 8px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:16px}
.list{flex:1;min-height:0;overflow-y:auto}
.sec{padding:12px 16px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{padding:18px 16px;color:var(--muted)}
.note .btn{display:block;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px;border:0;background:none;text-align:left}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--sel)}
.item-body{min-width:0;flex:1}
.item-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.item-bot{display:flex;align-items:center;gap:8px;margin-top:1px}
.preview{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.preview.on{color:var(--accent)}
.dot{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex:none}
.unread .title{font-weight:700}
.unread .preview{color:var(--ink)}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tab{position:relative;display:grid;justify-items:center;gap:2px;padding:8px 4px 9px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;display:grid;place-items:center}

/* avatars, star */
.av{width:var(--s,44px);height:var(--s,44px);border-radius:50%;display:inline-grid;place-items:center;flex:none;
  background:hsl(var(--h) 42% 38%);color:#fff;font-weight:600;font-size:calc(var(--s,44px)*.42);line-height:1}
.av.sq{border-radius:32%}
.av.owner{background:linear-gradient(145deg,#FFD65A,#E39A00);color:#3A2600;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--gold)}
.av-gap{width:32px;flex:none}
.star{color:var(--gold);font-size:.95em;margin-left:4px}
.stars-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold-bg);color:var(--gold);font-weight:600;border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.role{font-size:12px;color:var(--gold);font-weight:600}

/* settings pages */
.pane{padding-bottom:20px}
.sp-card{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:8px solid var(--panel-2);width:100%;border-top:0;border-left:0;border-right:0;background:none;text-align:left}
.sp-card:hover{background:var(--panel-2)}
.sp-name{font-weight:600;font-size:1.12em;display:flex;align-items:center;flex-wrap:wrap}
.sp-sub{color:var(--muted);font-size:.9em}
.group{border-bottom:8px solid var(--panel-2);padding:4px 0}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:10px 16px;border:0;background:none;text-align:left}
.srow:hover{background:var(--panel-2)}
.sico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c,var(--accent))}
.srow .lbl{flex:1;min-width:0}
.srow .val{color:var(--muted);font-size:.92em}
.srow .chev{color:var(--muted)}
.srow.gold .lbl{color:var(--gold);font-weight:600}
.pad{padding:12px 16px}
.hint-s{color:var(--muted);font-size:.86em;padding:6px 16px 10px}
.seg{display:flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:.9em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.opt{padding:10px 16px}
.opt .lbl{margin-bottom:6px;font-weight:500}
.sw{width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.prof-hero{display:grid;justify-items:center;gap:6px;padding:24px 16px 18px;text-align:center;border-bottom:8px solid var(--panel-2)}
.prof-hero .nm{font-weight:700;font-size:1.3em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.kv{display:grid;gap:2px;padding:10px 16px}
.kv .k{font-size:.82em;color:var(--muted)}
.kv .v{overflow-wrap:anywhere}
.wp-row{display:flex;gap:10px;padding:4px 16px 12px}
.wp{width:54px;height:54px;border-radius:12px;border:2px solid var(--line);background-color:var(--chat-bg);padding:0}
.wp[aria-pressed="true"]{border-color:var(--accent)}
.wp[data-wp="1"]{background-image:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%)}
.wp[data-wp="2"]{background-image:radial-gradient(circle at 18% 8%,color-mix(in srgb,var(--gold) 28%,transparent),transparent 55%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 50%)}
.wp[data-wp="3"]{background-image:radial-gradient(color-mix(in srgb,var(--ink) 12%,transparent) 1.2px,transparent 1.5px);background-size:10px 10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row-act{display:flex;align-items:center;gap:10px;padding:8px 16px}
.row-act .item-body{min-width:0;flex:1}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.85em}
.mini.danger{color:var(--danger);border-color:var(--danger)}

/* conversation */
.empty{flex:1;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.empty .mark{font-size:36px;margin-bottom:10px}
.conv{flex:1;min-height:0;display:flex;flex-direction:column}
.conv-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.conv-who{min-width:0;flex:1;border:0;background:none;text-align:left;padding:0;cursor:pointer}
.conv-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-sub.on{color:var(--accent)}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px;display:flex;flex-direction:column}
.hint{margin:auto;color:var(--muted);text-align:center;padding:16px}
.more{align-self:center;margin:4px 0 8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.day{align-self:center;margin:14px 0 6px;padding:3px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:2px;min-width:0}
.row:not(.run){margin-top:10px}
.row.mine{justify-content:flex-end}
.bubble{max-width:min(78%,560px);min-width:0;padding:8px 12px 6px;border-radius:16px;cursor:pointer;
  background:var(--their-bg);color:var(--their-fg);box-shadow:0 0 0 1px var(--line);overflow-wrap:anywhere}
.their .bubble{border-bottom-left-radius:5px}
.mine .bubble{background:var(--mine-bg);color:var(--mine-fg);box-shadow:none;border-bottom-right-radius:5px}
.bubble.sel{outline:2px solid var(--accent);outline-offset:2px}
.who{font-size:.85em;font-weight:600;color:hsl(var(--h) 55% var(--name-l));margin-bottom:1px}
.who.owner{color:var(--gold)}
.txt{white-space:pre-wrap}
.txt a{color:var(--accent)}
.mine .txt a{color:inherit;text-decoration:underline}
.meta{display:block;text-align:right;font-size:11px;opacity:.7;margin-top:2px;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:flex-end}
.acts button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:3px 11px;font-size:12.5px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);font-size:16px;line-height:1.35}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;flex:none}

/* gate */
.gate{flex:1;display:grid;place-items:center;min-width:0;overflow-y:auto}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.mark{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.gate-card .mark{font-size:28px;margin-bottom:18px}
.gate-card h1{font-size:22px;margin:0 0 8px;text-wrap:balance}
.gate-card p{margin:0 0 18px;color:var(--muted)}

/* sheet, forms, buttons */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--scrim);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{width:min(420px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.sheet-card h2{margin:0 0 14px;font-size:18px}
.sheet-card .sec{padding-left:0;padding-right:0;margin-top:8px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.plain{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:16px}
.field .help{font-size:12.5px;color:var(--muted)}
.field .help.bad{color:var(--danger)}
.field .help.ok{color:var(--accent)}
.pre{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:12px}
.pre span{padding-left:12px;color:var(--muted);font-size:16px}
.pre input{border:0;background:transparent;border-radius:12px;padding-left:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.people{margin:6px -20px 0}
.people .item{padding-left:20px;padding-right:20px}
.people .note{padding-left:20px;padding-right:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:min(92vw,420px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:14px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.scell{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;font-size:12px;color:var(--muted)}
.sring{position:relative;padding:3px;border-radius:50%;border:2px solid var(--line);display:inline-grid}
.sring.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.splus{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-weight:700;display:grid;place-items:center;font-size:14px;line-height:1}
.sname{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pane .ggrid{padding:0 14px 12px}
.gtile{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative;text-align:center}
.gtile.sel{outline:2px solid var(--accent)}
.gt-name,.gt-num{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-pin{position:absolute;left:6px;top:22px;font-size:12px}
.gcard{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 35%,var(--c1),var(--c2));display:grid;place-items:center}
.gcard.big{width:100%;aspect-ratio:1.25;border-radius:16px}
.gpat{position:absolute;inset:-10%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;font-size:18px;opacity:.14;line-height:1.5;overflow:hidden;pointer-events:none}
.gcard.big .gpat{font-size:26px}
.gemo{font-size:44px;line-height:1;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));animation:gfloat 3.2s ease-in-out infinite}
.gcard.big .gemo{font-size:96px}
.gshine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:gshine 4s ease-in-out infinite}
.gsp{position:absolute;color:#fff;font-style:normal;font-size:14px;opacity:0;animation:gtw 2.4s ease-in-out infinite}
.gsp.s1{left:18%;top:20%}.gsp.s2{right:16%;bottom:24%;animation-delay:1.1s}
@keyframes gfloat{50%{transform:translateY(-6%) rotate(-3deg)}}
@keyframes gshine{60%,100%{transform:translateX(120%)}}
@keyframes gtw{50%{opacity:1;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.gemo,.gshine,.gsp{animation:none!important}}
.gt{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.gr{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line)}
.gr:first-child{border-top:0}
.gr .k{background:var(--panel-2);padding:9px 12px;color:var(--muted)}
.gr .v{padding:9px 12px}
.tag{margin-left:8px;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--sel);color:var(--accent)}
.gt-foot{color:var(--muted);font-size:13px;margin-top:10px}
.swatches{display:flex;gap:8px;margin:12px 0}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.sv{position:fixed;inset:0;z-index:40;color:#fff;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sv-bars{display:flex;gap:4px}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bars i b{display:block;height:100%;width:0;background:#fff}
.sv-bars i.done b{width:100%}
.sv-bars i.cur b{animation:sbar 5.5s linear forwards}
@keyframes sbar{to{width:100%}}
.sv-head{display:flex;align-items:center;gap:10px;margin:12px 0;position:relative;z-index:2}
.sv-head .grow{flex:1;min-width:0}
.sv-head button{background:rgba(0,0,0,.3);border:0;color:#fff;border-radius:18px;padding:6px 12px}
.sv-text{flex:1;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:600;padding:0 12px;overflow-wrap:anywhere}

<script>
(function(){
"use strict";
var PAGE=60;
var DEF_PRIV={phone:"all",seen:"all",dm:"all"};
var $=function(s){return document.querySelector(s)};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
var S={bans:new Map(),grants:new Map(),wallets:new Map(),spends:new Map(),nfts:new Map(),stories:new Map(),intr:new Map(),real:null,db:null,auth:null,user:null,me:null,meName:"",meNick:null,isOwner:false,ownerId:null,stars:1000000,gateMode:null,fatal:null,
  profiles:new Map(),profilesLoaded:false,presence:new Map(),groups:new Map(),dms:new Map(),gotG:false,gotD:false,
  reads:{},readsLoaded:false,active:null,threadsBy:new Map(),threadsLoaded:false,threadsSlow:false,

  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},

var chain=new Map();
function enqueue(key,fn){
  var prev=chain.get(key)||Promise.resolve();
  var next=prev.catch(function(){}).then(fn);

  return next;
}

/* ---------- icons ---------- */
var ICONS={
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',

  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 5a3.5 3.5 0 010 7M18 15c2 .7 3.5 2.3 3.5 5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',

function ico(name,size,sw){
  var s=el("span");s.style.display="inline-grid";
  s.innerHTML='<svg viewBox="0 0 24 24" width="'+(size||22)+'" height="'+(size||22)+'" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>';
  return s;
}

/* ---------- helpers ---------- */
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360}
function initial(t){var m=String(t||"").trim().match(/[\p{L}\p{N}]/u);return m?m[0].toUpperCase():"?"}
function isOwnerUid(uid){return !!uid&&(uid===S.ownerId||(S.isOwner&&uid===S.me))}
function avatar(key,label,shape,size){
  var own=shape!=="sq"&&isOwnerUid(String(key));
  var d=el("span","av"+(shape==="sq"?" sq":"")+(own?" owner":""),initial(label));
  d.style.setProperty("--h",hue(String(key)));
  d.style.setProperty("--s",(size||44)+"px");
  d.setAttribute("aria-hidden","true");
  return d;
}
function starMark(uid){
  if(!isOwnerUid(uid))return null;
  var s=el("span","star","★");s.title="Владелец Kolwer";return s;
}
function nickOf(uid){var p=S.profiles.get(uid);return p&&p.nick?p.nick:"Участник"}
function nameWithStar(cls,uid,text){
  var d=el("div",cls);d.append(text);
  var s=starMark(uid);if(s)d.append(s);
  return d;
}
function fmtStars(n){return new Intl.NumberFormat("ru-RU").format(n)}
function normPhone(v){
  var d=String(v||"").replace(/\D/g,"");
  if(d.length===11&&d[0]==="8")d="7"+d.slice(1);
  return d;
}
function validPhone(d){return d.length>=10&&d.length<=15}
function fmtPhone(d){
  if(!d)return "";
  if(d.length===11&&d[0]==="7")return "+7 ("+d.slice(1,4)+") "+d.slice(4,7)+"-"+d.slice(7,9)+"-"+d.slice(9);
  return "+"+d;
}
function phoneVisible(uid){
  var p=S.profiles.get(uid);
  if(!p||!p.phone)return false;
  return uid===S.me||S.isOwner||(p.priv&&p.priv.phone!=="none");
}
var fmtT=new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit"});
function startOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function dayKey(ms){var d=new Date(ms);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function dayLabel(ms){
  var d=new Date(ms),now=new Date();
  var diff=Math.round((startOf(now)-startOf(d))/864e5);
  if(diff===0)return "Сегодня";
  if(diff===1)return "Вчера";
  var o={day:"numeric",month:"long"};
  if(d.getFullYear()!==now.getFullYear())o.year="numeric";
  return d.toLocaleDateString("ru-RU",o);
}
function listTime(ms){
  if(!ms)return "";
  var d=new Date(ms),now=new Date();
  var diff=Math.round((startOf(now)-startOf(d))/864e5);
  if(diff===0)return fmtT.format(d);
  if(diff>0&&diff<7)return d.toLocaleDateString("ru-RU",{weekday:"short"});
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
function statusOf(uid){
  if(uid===S.me)return {t:"в сети",on:true};
  var p=S.profiles.get(uid),t=S.presence.get(uid);
  var hide=p&&p.priv&&p.priv.seen==="none"&&!S.isOwner;
  if(!t||hide)return {t:"был(а) недавно",on:false};
  if(Date.now()-t<4*60000)return {t:"в сети",on:true};
  if(dayKey(t)===dayKey(Date.now()))return {t:"был(а) в "+fmtT.format(t),on:false};
  return {t:"был(а) "+dayLabel(t).toLowerCase(),on:false};
}
function errText(e){
  var c=e&&e.code;
  if(c==="taken")return e.path&&e.path.indexOf("usernames/")===0?"Этот юзернейм занят.":"Этот номер уже привязан к другому аккаунту.";
  if(c==="closed_dm")return "Пользователь закрыл личные сообщения.";
  if(c==="quota_exceeded")return "Хранилище заполнено. Удалите старые сообщения.";
  if(c==="invalid_argument")return "Нет права на запись. Нужен доступ редактора.";
  if(c==="resource_exhausted")return "Слишком часто. Подождите секунду.";
  if(c==="revoked")return "Доступ закрыт.";
  return "Не получилось. Попробуйте ещё раз.";
}
var toastT=0;
function toast(t){var n=$("#toast");n.textContent=t;n.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){n.hidden=true},3500)}
function addText(node,text){
  var re=/https?:\/\/[^\s<>"']+/g,last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)node.append(text.slice(last,m.index));
    var url=m[0],trail="";
    var tm=url.match(/[.,;:!?)\]]+$/);
    if(tm){trail=tm[0];url=url.slice(0,url.length-trail.length)}
    var a=document.createElement("a");
    a.href=url;a.textContent=url;a.target="_blank";a.rel="noopener noreferrer";
    node.append(a);
    if(trail)node.append(trail);
    last=m.index+m[0].length;
  }
  if(last<text.length)node.append(text.slice(last));
}
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    var a=S.ac||(S.ac=new C());
    var o=a.createOscillator(),g=a.createGain();
    o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+.12);
  }catch(e){}
}

/* ---------- local preferences ---------- */
function applyPrefs(){
  var th=ls.get("kw:theme"),r=document.documentElement;
  if(th==="light"||th==="dark")r.setAttribute("data-theme",th);else r.removeAttribute("data-theme");
  var fs=Number(ls.get("kw:fs"))||15;
  document.body.style.setProperty("--fs",fs+"px");
  $("#mainPane").setAttribute("data-wp",ls.get("kw:wp")||"0");
}
function pref(k,def){var v=ls.get("kw:"+k);return v==null?def:v!=="0"}

/* ---------- data shaping ---------- */
function chatData(v,kind){
  if(!v||typeof v!=="object")return null;
  var c={kind:kind,title:String(v.title||"").slice(0,40),about:String(v.about||"").slice(0,80),
    at:Number(v.at)||0,lastAt:Number(v.lastAt)||0,
    lastFrom:typeof v.lastFrom==="string"?v.lastFrom:null,lastText:String(v.lastText||"").slice(0,140)};
  if(kind==="dm"){
    if(!Array.isArray(v.members)||v.members.length!==2||!v.members.every(function(x){return typeof x==="string"}))return null;
    c.members=v.members;
  }else if(!c.title)return null;
  return c;
}
function activeChat(){return S.active?(S.groups.get(S.active)||S.dms.get(S.active)||null):null}
function otherOf(c){return c.members.find(function(x){return x!==S.me})||S.me}
function titleOf(c){return c.kind==="dm"?nickOf(otherOf(c)):c.title}
function chatList(){
  var out=[];
  S.groups.forEach(function(c,id){out.push(Object.assign({id:id},c))});
  S.dms.forEach(function(c,id){if(c.lastAt>0||id===S.active)out.push(Object.assign({id:id},c))});
  out.sort(function(a,b){return (b.lastAt||0)-(a.lastAt||0)});
  return out;
}
function isUnread(c){return c.id!==S.active&&!!c.lastFrom&&c.lastFrom!==S.me&&(c.lastAt||0)>(S.reads[c.id]||0)}
function allMessages(cid){
  var map=S.threadsBy.get(cid),arr=[];
  if(!map)return arr;
  map.forEach(function(e){
    var d=e.data;
    if(!d||typeof d.from!=="string"||!Array.isArray(d.items))return;
    d.items.forEach(function(it){
      if(it&&typeof it.t==="string"&&typeof it.i==="string"&&isFinite(it.at))arr.push({from:d.from,i:it.i,t:it.t.slice(0,1000),at:Number(it.at)});
    });
  });
  arr.sort(function(a,b){return a.at-b.at||(a.i<b.i?-1:a.i>b.i?1:0)});
  return arr;
}

/* ---------- username / phone validation ---------- */
var UN_RE=/^[a-z][a-z0-9_]{4,31}$/;
function cleanUn(v){return String(v||"").trim().replace(/^@/,"").toLowerCase()}
function unHint(v,help){
  var u=cleanUn(v),ex=S.profiles.get(S.me);
  help.className="help";
  if(!u){help.textContent="Латиница, цифры и «_», от 5 символов. Друзья найдут вас по @юзернейму.";return false}
  if(!UN_RE.test(u)){help.textContent="От 5 до 32 символов: a-z, 0-9, «_». Начинается с буквы.";help.className="help bad";return false}
  var taken=false;
  S.profiles.forEach(function(p,id){if(id!==S.me&&p.username===u)taken=true});
  if(taken){help.textContent="@"+u+" занят.";help.className="help bad";return false}
  help.textContent=(ex&&ex.username===u?"Это ваш юзернейм.":"@"+u+" свободен.");help.className="help ok";
  return true;
}

/* ---------- gate (loading, sign-in problems, first-run registration) ---------- */
var COPY={banned:["Доступ закрыт","Владелец заблокировал этот аккаунт."],
  loading:["Подключаюсь","Загружаю чаты."],
  login:["Войдите в Kolwer","Введите почту и пароль или создайте аккаунт."],
  noid:["Не удалось войти","Проверьте подключение и попробуйте ещё раз."],
  readonly:["Нет доступа","Ваш аккаунт не имеет доступа к этим данным."],
  revoked:["Доступ закрыт","Владелец страницы закрыл вам доступ."]
};
function formField(id,label,value,max,o){
  o=o||{};
  var w=el("div","field"),l=el("label",null,label);l.htmlFor=id;
  var i=el("input");i.id=id;i.type=o.type||"text";i.maxLength=max;i.value=value||"";i.autocomplete="off";
  if(o.ph)i.placeholder=o.ph;
  if(o.mode)i.inputMode=o.mode;
  var box=i;
  if(o.prefix){box=el("div","pre");box.append(el("span",null,o.prefix),i)}
  w.append(l,box);
  var help=null;
  if(o.help!==undefined){help=el("div","help",o.help);w.append(help)}
  return {wrap:w,input:i,help:help};
}
function showGate(mode){
  var g=$("#gate");
  if(S.gateMode===mode&&!g.hidden)return;
  S.gateMode=mode;
  $("#app").hidden=true;
  g.hidden=false;
  var card=el("div","gate-card");
  card.append(el("div","mark","Kolwer"));
  if(mode==="login"){
    card.append(el("h1",null,"Вход в Kolwer"));
    card.append(el("p",null,"Войдите или создайте аккаунт по электронной почте."));
    var f=el("form"),em=formField("email","Электронная почта","",120,{type:"email",ph:"name@example.com"}),pw=formField("password","Пароль","",80,{type:"password",ph:"Не менее 6 символов"});
    var err=el("div","help");
    var login=el("button","btn","Войти");login.type="submit";
    var reg=el("button","btn ghost","Создать аккаунт");reg.type="button";
    f.append(em.wrap,pw.wrap,err,login,reg);
    function authError(e){var m="Не удалось выполнить вход.";if(e.code==="auth/invalid-email")m="Проверьте адрес почты.";else if(e.code==="auth/user-not-found"||e.code==="auth/wrong-password"||e.code==="auth/invalid-credential")m="Неверная почта или пароль.";else if(e.code==="auth/email-already-in-use")m="Эта почта уже зарегистрирована. Нажмите «Войти».";else if(e.code==="auth/weak-password")m="Пароль должен содержать не менее 6 символов.";else if(e.code==="auth/network-request-failed")m="Нет соединения. Проверьте интернет.";err.textContent=m;login.disabled=false;reg.disabled=false;}
    function validate(){if(!em.input.value.trim()||!pw.input.value){err.textContent="Введите почту и пароль.";return false}if(pw.input.value.length<6){err.textContent="Пароль должен содержать не менее 6 символов.";return false}return true}
    f.addEventListener("submit",function(e){e.preventDefault();if(!validate())return;login.disabled=true;reg.disabled=true;S.auth.signInWithEmailAndPassword(em.input.value.trim(),pw.input.value).catch(authError)});
    reg.addEventListener("click",function(){if(!validate())return;login.disabled=true;reg.disabled=true;S.auth.createUserWithEmailAndPassword(em.input.value.trim(),pw.input.value).catch(authError)});
    card.append(f);g.replaceChildren(card);return;
  }
  if(mode==="welcome"){
    card.append(el("h1",null,"Создайте профиль"));
    var p=el("p");
    if(S.meName){p.append("Вы вошли как ");p.append(el("b",null,S.meName));p.append(". ")}
    p.append("Имя и @юзернейм увидят друзья. Номер телефона по желанию: по нему вас смогут найти.");
    card.append(p);
    var f=el("form");
    var n=formField("nick","Имя",(S.meName||"").slice(0,24),24);
    var u=formField("uname","Юзернейм","",32,{prefix:"@",ph:"username",help:""});
    var ph=formField("phone","Номер телефона (необязательно)","",20,{type:"tel",mode:"tel",ph:"+7 900 000 00 00"});
    unHint("",u.help);
    u.input.addEventListener("input",function(){unHint(u.input.value,u.help)});
    var go=el("button","btn","Войти в Kolwer");go.type="submit";
    f.append(n.wrap,u.wrap,ph.wrap,go);
    f.addEventListener("submit",function(e){
      e.preventDefault();
      var nick=n.input.value.trim(),un=cleanUn(u.input.value),pn=normPhone(ph.input.value);
      if(!nick){toast("Введите имя");n.input.focus();return}
      if(!unHint(un,u.help)){toast("Проверьте юзернейм");u.input.focus();return}
      if(pn&&!validPhone(pn)){toast("Номер указан неверно");ph.input.focus();return}
      go.disabled=true;
      saveProfile({nick:nick,username:un,phone:pn,bio:""}).catch(function(err){go.disabled=false;toast(errText(err))});
    });
    card.append(f);
    g.replaceChildren(card);
    n.input.focus({preventScroll:true});
    return;
  }
  var c=COPY[mode]||COPY.loading;
  card.append(el("h1",null,c[0]));
  var pp=el("p",null,c[1]);pp.id="gateSub";
  card.append(pp);
  g.replaceChildren(card);
}
function route(){
  if(S.fatal){showGate(S.fatal);return}
  if(!S.isOwner&&S.bans.has(S.real)){showGate("banned");return}
  if(!S.profilesLoaded){showGate("loading");return}
  if(!S.profiles.has(S.me)){showGate("welcome");return}
  if(S.gateMode!=="app"){S.gateMode="app";$("#gate").hidden=true;$("#app").hidden=false;applyPrefs();heartbeat()}
  S.meNick=nickOf(S.me);
  refreshSide();
  renderConvHead();
  autoOpen();
}

/* ---------- sidebar: tabs, header, pages ---------- */
function note(t){return el("div","note",t)}
function personRow(id,p,onClick,sub){
  var b=el("button","item");b.type="button";
  b.append(avatar(id,p.nick));
  var body=el("div","item-body");
  var top=nameWithStar("title",id,p.nick);
  body.append(top);
  var st=sub||(p.username?"@"+p.username:"");
  if(st){var pv=el("div","preview",st);body.append(pv)}
  b.append(body);
  b.addEventListener("click",onClick);
  return b;
}
function chatRow(c){
  var unread=isUnread(c);
  var b=el("button","item"+(unread?" unread":""));b.type="button";
  if(c.id===S.active)b.setAttribute("aria-current","true");
  var title=titleOf(c);
  b.append(c.kind==="dm"?avatar(otherOf(c),title):avatar(c.id,title,"sq"));
  var body=el("div","item-body");
  var top=el("div","item-top");
  top.append(c.kind==="dm"?nameWithStar("title",otherOf(c),title):el("div","title",title),el("div","time",listTime(c.lastAt)));
  var bot=el("div","item-bot");
  var pv;
  if(c.lastFrom){
    pv=(c.lastFrom===S.me?"Вы: ":(c.kind==="group"?nickOf(c.lastFrom)+": ":""))+c.lastText;
  }else{
    pv=c.kind==="group"?(c.about||"Сообщений пока нет"):"Сообщений пока нет";
  }
  bot.append(el("div","preview",pv));
  if(unread)bot.append(el("span","dot","•"));
  body.append(top,bot);
  b.append(body);
  b.addEventListener("click",function(){openChat(c.id)});
  return b;
}

function paneChats(){
  var q=S.query.trim().toLowerCase(),frag=document.createDocumentFragment();
  var chats=chatList();
  if(!q)frag.append(peopleStrip());
  if(!q){
    if(!chats.length)frag.append(note("Чатов пока нет. Нажмите плюс, чтобы создать первый."));
    chats.forEach(function(c){frag.append(chatRow(c))});
  }else{
    var hit=chats.filter(function(c){return (titleOf(c)+" "+c.lastText+" "+(c.about||"")).toLowerCase().indexOf(q)>=0});
    var ppl=peopleMatch(q);
    if(hit.length){frag.append(el("div","sec","Чаты"));hit.forEach(function(c){frag.append(chatRow(c))})}
    if(ppl.length){
      frag.append(el("div","sec","Люди"));
      ppl.slice(0,20).forEach(function(x){frag.append(personRow(x[0],x[1],function(){clearSearch();openDm(x[0]).catch(function(e){toast(errText(e))})}))});
    }
    if(!hit.length&&!ppl.length){
      var n=note("Ничего не нашлось.");
      var b=el("button","btn ghost","Создать чат «"+S.query.trim().slice(0,40)+"»");b.type="button";
      b.addEventListener("click",function(){openNewChat(S.query.trim())});
      n.append(b);frag.append(n);
    }
  }
  var w=el("div");w.append(frag);return w;
}
function peopleMatch(q){
  var out=[],qd=q.replace(/\D/g,""),qu=q.replace(/^@/,"");
  S.profiles.forEach(function(p,id){
    if(id===S.me)return;
    var hay=(p.nick+" "+p.bio+" "+(p.username||"")+" "+xtra(id)).toLowerCase();
    var ok=hay.indexOf(qu)>=0||(qd.length>=3&&phoneVisible(id)&&p.phone.indexOf(qd)>=0);
    if(ok)out.push([id,p]);
  });
  return out;
}
function paneContacts(){
  var w=el("div"),q=S.query.trim().toLowerCase(),arr=[];
  if(q)arr=peopleMatch(q);
  else S.profiles.forEach(function(p,id){if(id!==S.me&&!isBlk(id))arr.push([id,p])});
  arr.sort(function(a,b){
    var ao=isOwnerUid(a[0])?1:0,bo=isOwnerUid(b[0])?1:0;
    if(ao!==bo)return bo-ao;
    var an=statusOf(a[0]).on?1:0,bn=statusOf(b[0]).on?1:0;
    if(an!==bn)return bn-an;
    return a[1].nick.localeCompare(b[1].nick,"ru");
  });
  if(!arr.length){w.append(note(q?"Ничего не нашлось.":"Пока здесь только вы. Когда друг зайдёт, он появится в списке."));return w}
  w.append(el("div","sec",q?"Найдено":"Все люди · "+arr.length));
  arr.forEach(function(x){
    var st=statusOf(x[0]);
    var b=personRow(x[0],x[1],function(){openUserSheet(x[0])},(x[1].username?"@"+x[1].username+" · ":"")+st.t);
    w.append(b);
  });
  return w;
}

function sameRun(a,b){return !!a&&!!b&&a.from===b.from&&dayKey(a.at)===dayKey(b.at)&&Math.abs(b.at-a.at)<300000}
function renderMsgs(force){
  if(!S.active)return;
  var box=$("#msgs");
  var near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  var prevH=box.scrollHeight,prevTop=box.scrollTop;
  var all=allMessages(S.active),c=activeChat(),group=!!c&&c.kind==="group";
  var frag=document.createDocumentFragment();
  if(!all.length){
    var t=!S.threadsLoaded?(S.threadsSlow?"Ответа от хранилища пока нет. Страница подключится сама.":"Загружаю историю…"):"Здесь пока тихо. Напишите первое сообщение.";
    frag.append(el("div","hint",t));
  }
  var start=Math.max(0,all.length-S.shown);
  if(start>0){
    var more=el("button","more","Показать раньше ("+start+")");more.type="button";
    more.addEventListener("click",function(){S.shown+=150;renderMsgs()});
    frag.append(more);
  }
  for(var k=start;k<all.length;k++){
    var m=all[k],prev=k>start?all[k-1]:null,next=k<all.length-1?all[k+1]:null;
    if(!prev||dayKey(prev.at)!==dayKey(m.at))frag.append(el("div","day",dayLabel(m.at)));
    frag.append(msgRow(m,{first:!sameRun(prev,m),last:!sameRun(m,next),group:group}));
  }
  box.replaceChildren(frag);
  if(force||near)box.scrollTop=box.scrollHeight;else box.scrollTop=prevTop+(box.scrollHeight-prevH);
  if(S.focusKey){
    var fk=S.focusKey;S.focusKey=null;
    var n=box.querySelector('[data-key="'+CSS.escape(fk)+'"]');
    if(n)n.focus({preventScroll:true});
  }
}

var unsubThreads=null,threadsTimer=0;

      if(v&&typeof v==="object"&&Array.isArray(v.items))map.set(d.id,{id:d.id,data:v});
    });
    var wasLoaded=S.threadsLoaded;
    if(!snap.metadata.fromCache){S.threadsLoaded=true;clearTimeout(threadsTimer)}

/* ---------- writing ---------- */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function claim(path){
  var r=S.db.doc(path);
  return r.get().then(function(s){
    var d=s.exists?s.data():null;
    if(d&&d.uid&&d.uid!==S.me)throw {code:"taken",path:path};
    return r.set({uid:S.me});
  });
}
function profileDoc(ex,d){
  return {nick:d.nick,bio:d.bio,username:d.username,phone:d.phone||"",priv:ex.priv||DEF_PRIV,at:ex.at||Date.now()};
}
function saveProfile(d){
  var ex=S.profiles.get(S.me)||{};
  var steps=Promise.resolve();
  if(d.username!==ex.username)steps=steps.then(function(){return claim("usernames/"+d.username)});
  if(d.phone&&d.phone!==ex.phone)steps=steps.then(function(){return claim("phones/"+d.phone)});
  return steps.then(function(){
    return S.db.doc("profiles/"+S.me).set(profileDoc(ex,d));
  }).then(function(){
    if(ex.username&&ex.username!==d.username)S.db.doc("usernames/"+ex.username).delete().catch(function(){});
    if(ex.phone&&ex.phone!==d.phone)S.db.doc("phones/"+ex.phone).delete().catch(function(){});
  });
}
function patchProfile(patch){
  var ex=S.profiles.get(S.me);
  if(!ex)return Promise.reject({code:"unavailable"});
  var d=Object.assign(profileDoc(ex,{nick:ex.nick,bio:ex.bio,username:ex.username,phone:ex.phone}),patch);
  return S.db.doc("profiles/"+S.me).set(d);
}
function deleteUser(id,p){
  var jobs=[S.db.doc("profiles/"+id).delete(),S.db.doc("presence/"+id).delete()];
  if(p.username)jobs.push(S.db.doc("usernames/"+p.username).delete());
  if(p.phone)jobs.push(S.db.doc("phones/"+p.phone).delete());
  return Promise.all(jobs);
}
function deleteChat(id){
  if(S.active===id)closeChat();
  return S.db.collection("chats/"+id+"/threads").get().then(function(snap){
    return Promise.all(snap.docs.map(function(d){return S.db.doc("chats/"+id+"/threads/"+d.id).delete()}));
  }).then(function(){return S.db.doc("chats/"+id).delete()});
}
function sendMessage(cid,text){
  return enqueue("send:"+cid,function(){
    var map=S.threadsBy.get(cid);
    if(!map)throw {code:"unavailable"};
    var mine=[];
    map.forEach(function(e){if(e.data.from===S.me)mine.push(e)});
    mine.sort(function(a,b){return (Number(a.data.n)||0)-(Number(b.data.n)||0)});
    var lastDoc=mine.length?mine[mine.length-1]:null;
    var msg={i:newId(),t:text,at:Date.now()};
    var docId,data;
    if(lastDoc&&lastDoc.data.items.length<PAGE){
      docId=lastDoc.id;
      data={from:S.me,n:Number(lastDoc.data.n)||0,items:lastDoc.data.items.concat([msg])};
    }else{
      var n=lastDoc?(Number(lastDoc.data.n)||0)+1:0;
      docId=S.me+"_"+n;
      data={from:S.me,n:n,items:[msg]};
    }
    map.set(docId,{id:docId,data:data});
    if(S.active===cid)renderMsgs(true);
    return S.db.doc("chats/"+cid+"/threads/"+docId).set(data).then(function(){
      return S.db.doc("chats/"+cid).update({lastAt:msg.at,lastFrom:S.me,lastText:text.slice(0,140)});
    });
  });
}
function deleteMessage(cid,m){
  if(m.from!==S.me&&!S.isOwner)return Promise.reject({code:"invalid_argument"});
  return enqueue("send:"+cid,function(){
    var map=S.threadsBy.get(cid);
    if(!map)return;
    var hit=null;
    map.forEach(function(e){
      if(e.data.from===m.from&&e.data.items.some(function(x){return x.i===m.i}))hit=e;
    });
    if(!hit)return;
    var data={from:hit.data.from,n:Number(hit.data.n)||0,items:hit.data.items.filter(function(x){return x.i!==m.i})};
    map.set(hit.id,{id:hit.id,data:data});
    if(S.active===cid)renderMsgs();
    return S.db.doc("chats/"+cid+"/threads/"+hit.id).set(data).then(function(){
      var c=S.groups.get(cid)||S.dms.get(cid);
      if(!c||m.at<(c.lastAt||0))return;
      var rest=allMessages(cid),l=rest.length?rest[rest.length-1]:null;
      var upd=l?{lastAt:l.at,lastFrom:l.from,lastText:l.t.slice(0,140)}:{lastAt:c.kind==="dm"?0:(c.at||0),lastFrom:null,lastText:""};
      return S.db.doc("chats/"+cid).update(upd);
    });
  });
}

var slowTimer=0;
function subscribe(){
  var db=S.db,me=S.me;sub2();
  function onErr(e){if(e&&e.code==="revoked"){S.fatal="revoked";route()}else toast(errText(e))}
  slowTimer=setTimeout(function(){
    var g=$("#gateSub");
    if(S.gateMode==="loading"&&g)g.textContent="Ответа от хранилища пока нет. Страница подключится сама, когда появится связь.";
  },10000);
  db.collection("profiles").onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){
      var v=d.data();
      if(v&&typeof v.nick==="string"&&v.nick.trim()){
        var pv=v.priv&&typeof v.priv==="object"?v.priv:{};
        m.set(d.id,{nick:v.nick.slice(0,24),bio:typeof v.bio==="string"?v.bio.slice(0,100):"",
          username:typeof v.username==="string"?v.username.slice(0,32):"",

          priv:{phone:pv.phone==="none"?"none":"all",seen:pv.seen==="none"?"none":"all",dm:pv.dm==="none"?"none":"all"},
          at:Number(v.at)||0});
      }
    });
    S.profiles=m;
    if(!snap.metadata.fromCache){S.profilesLoaded=true;clearTimeout(slowTimer)}
    route();
    if(S.gateMode==="app"){renderMsgs()}
  },onErr);
  db.collection("presence").onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){var v=d.data();if(v&&isFinite(v.t))m.set(d.id,Number(v.t))});
    S.presence=m;
    if(S.gateMode==="app"){renderConvHead();if(S.tab==="contacts"&&!S.sub)renderSide()}
  },function(){});
  db.doc("meta/owner").onSnapshot(function(snap){
    var v=snap.data();
    S.ownerId=v&&typeof v.id==="string"?v.id:null;
    S.stars=v&&isFinite(v.stars)?Number(v.stars):1000000;
    if(S.gateMode==="app"){refreshSide();renderConvHead();renderMsgs()}
  },function(){});
  db.collection("chats").where("kind","==","group").onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){var v=chatData(d.data(),"group");if(v)m.set(d.id,v)});
    S.groups=m;S.gotG=true;afterChats();
  },onErr);
  db.collection("chats").where("members","array-contains",me).onSnapshot(function(snap){
    var m=new Map();
    snap.docs.forEach(function(d){var v=chatData(d.data(),"dm");if(v)m.set(d.id,v)});
    S.dms=m;S.gotD=true;afterChats();
  },onErr);
  db.doc("data/users/"+S.real+"/reads").onSnapshot(function(snap){
    var v=snap.data();
    S.reads=(v&&v.m&&typeof v.m==="object")?v.m:{};
    if(!snap.metadata.fromCache)S.readsLoaded=true;
    refreshSide();markRead();
  },onErr);
}
function notifyNew(){

    S.notifReady=true;

      if((c.lastAt||0)>prev&&c.lastFrom&&c.lastFrom!==S.me&&(c.id!==S.active||document.hidden)){

}

var PT=[["Broken Heart","💔",0.3],["Dollar","💰",1],["Sparkle","✨",2]];

function gx(n){return {c:kind(n.k),b:BD[n.bi]||BD[0],m:MD[n.mi]||MD[0],p:PT[n.pi]||PT[0]}}
function valueOf(n){var x=gx(n);return Math.round(x.c[3]*80*(10/(x.m[1]+x.p[2]+x.b[3])))}
function mint(k,owner,from){return S.db.doc("nfts/"+newId()).set({k:k,mi:pickW(MD,1),pi:pickW(PT,2),bi:pickW(BD,3),num:1+Math.floor(Math.random()*99999),owner:owner,from:from,at:Date.now(),pin:false})}
function buyGift(k,to){
  var c=kind(k);

    if(bal(S.me)<c[3])return Promise.reject({msg:"Не хватает звёзд. Нужно ★ "+fmtStars(c[3])});
    if(mintedOf(k)>=c[4])return Promise.reject({msg:"Этот подарок распродан."});

  var sp=(S.spends.get(S.real)||{}).spent||0;
  var p=S.isOwner?Promise.resolve():S.db.doc("spends/"+S.real).set({spent:sp+c[3]});
  return p.then(function(){return mint(k,to,S.me)}).then(function(){toast("Готово: «"+c[1]+"» добавлен в подарки")},function(e){toast(errText(e));throw e});
}

function kdf(pin,salt){
  var te=new TextEncoder();
  return crypto.subtle.importKey("raw",te.encode(pin),"PBKDF2",false,["deriveBits"]).then(function(k){
    return crypto.subtle.deriveBits({name:"PBKDF2",salt:te.encode(salt),iterations:200000,hash:"SHA-256"},k,256);
  }).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")});
}

  var w=el("div","pane pad");
  ["Вход выполняется через Firebase Authentication по электронной почте и паролю.","Данные идут по защищённому соединению (HTTPS/TLS).","Панель владельца и выдача звёзд, номеров 888, юзернеймов, банов доступны только владельцу; попытки обхода записываются в журнал.","PIN-код на этом устройстве: хранится только как хеш (PBKDF2, 200 000 итераций)."].forEach(function(t){var p=el("p",null,t);p.style.margin="0 0 10px";w.append(p)});
  var has=!!ls.get("kw:pin"),f=el("form"),pf=formField("npin",has?"Новый PIN (4–12 цифр)":"PIN (4–12 цифр)","",12,{type:"password",mode:"numeric"});
  var sb=el("button","btn",has?"Сменить PIN":"Установить PIN");sb.type="submit";f.append(pf.wrap,sb);
  f.addEventListener("submit",function(e){
    e.preventDefault();var v=pf.input.value;if(!/^\d{4,12}$/.test(v)){toast("PIN: от 4 до 12 цифр");return}
    var salt=newId();kdf(v,salt).then(function(h){ls.set("kw:pin",salt+":"+h);toast("PIN установлен");renderSide()});
  });
  w.append(f);
  var row=el("div","btn-row");row.style.marginTop="12px";
  if(has){var rm=el("button","btn ghost","Отключить PIN");rm.type="button";rm.addEventListener("click",function(){try{localStorage.removeItem("kw:pin")}catch(e){}toast("PIN отключён");renderSide()});row.append(rm)}
  var ow=el("button","btn ghost","Войти как владелец");ow.type="button";ow.addEventListener("click",function(){if(S.isOwner)go("settings","admin");else denied("owner-login")});row.append(ow);
  var out=el("button","btn ghost","Выйти из аккаунта");out.type="button";out.style.marginTop="12px";out.addEventListener("click",function(){S.auth.signOut().catch(function(){toast("Не удалось выйти")})});
  w.append(out);
  w.append(row);return w;
}
function pinGate(){
  var rec=ls.get("kw:pin");if(!rec)return Promise.resolve();
  return new Promise(function(res){
    var g=$("#gate");S.gateMode="pin";$("#app").hidden=true;g.hidden=false;
    var card=el("div","gate-card");card.append(el("div","mark","Kolwer"),el("h1",null,"Введите PIN"));
    var f=el("form"),i=el("input");i.type="password";i.inputMode="numeric";i.maxLength=12;i.autocomplete="off";i.setAttribute("aria-label","PIN");
    i.style.cssText="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:18px;margin:8px 0";
    var err=el("div","help"),b=el("button","btn","Открыть");b.type="submit";f.append(i,err,b);card.append(f);g.replaceChildren(card);i.focus();
    var fails=0,lock=0;
    f.addEventListener("submit",function(e){
      e.preventDefault();
      if(Date.now()<lock){err.textContent="Подождите: вход временно закрыт.";return}
      var parts=rec.split(":");
      kdf(i.value,parts[0]).then(function(h){
        if(h===parts[1]){var nf=Number(ls.get("kw:pinfail")||0);if(nf){ls.set("kw:pinfail","0");logIntr("Неверный PIN ×"+nf)}S.gateMode=null;res()}
        else{fails++;ls.set("kw:pinfail",String(Number(ls.get("kw:pinfail")||0)+1));i.value="";err.style.color="var(--danger)";err.textContent="Ошибка: неверный PIN. Попытка записана.";if(fails>=5){lock=Date.now()+60000;fails=0;err.textContent="Слишком много попыток. Подождите минуту."}}
      });
    });
  });
}

/* ---------- live data + filler ---------- */
var uiT=0;
function ui(){
  clearTimeout(uiT);
  uiT=setTimeout(function(){
    if(S.gateMode!=="app")return;
    if(S.sub!=="accounts"&&S.sub!=="sec"&&S.sub!=="edit")refreshSide();
    fillEmpty();
  },150);
}
function fillEmpty(){
  var e=$("#empty");if(!e||e.hidden||!e.firstElementChild)return;
  var sc=$("#showcase");if(!sc){sc=el("div","showcase");sc.id="showcase";e.firstElementChild.append(sc)}
  var pick=null;S.nfts.forEach(function(v){if(!pick||v.pin)pick=v});
  var n=pick||{k:"pepe",mi:0,pi:0,bi:0,num:212};
  var ns=0;S.stories.forEach(function(s){if(s.at>Date.now()-864e5)ns++});
  sc.replaceChildren(gCard(n,true),el("div","gt-foot","Людей: "+S.profiles.size+" · Подарков: "+S.nfts.size+" · Историй: "+ns));
}
function sub2(){
  var cols=[["bans","bans"],["grants","grants"],["wallets","wallets"],["spends","spends"],["nfts","nfts"],["stories","stories"]];
  if(S.isOwner)cols.push(["intrusions","intr"]);
  cols.forEach(function(x){
    S.db.collection(x[0]).onSnapshot(function(snap){
      var m=new Map();snap.docs.forEach(function(d){m.set(d.id,d.data()||{})});
      S[x[1]]=m;if(x[1]==="bans")route();ui();
    },function(){});
  });
}

async function start(){
  applyPrefs();
  if(!window.firebase){showGate("noid");return}
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  S.auth=firebase.auth();
  S.db=firebase.firestore();
  S.auth.onAuthStateChanged(async function(user){
    if(!user){S.real=null;S.me=null;S.isOwner=false;S.profilesLoaded=false;showGate("login");return}
    try{
      S.real=user.uid;S.me=user.uid;S.user=user;S.meName=user.displayName||user.email||"";
      var ownerSnap=await S.db.doc("meta/owner").get();
      var ownerData=ownerSnap.exists?ownerSnap.data():null;
      S.ownerId=ownerData&&typeof ownerData.id==="string"?ownerData.id:null;
      S.isOwner=S.ownerId===user.uid;
      subscribe();
    }catch(e){console.error("FIREBASE START",e);showGate("noid")}
  });
}
start().catch(function(e){console.error("START",e);showGate("noid")});
